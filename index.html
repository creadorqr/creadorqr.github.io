<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>QR Generator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  @font-face {
    font-family: "Barlow Condensed"; font-weight: 600; font-display: swap;
    src: url("fonts/barlow-condensed-600.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #111827; color: #f3f4f6;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.6rem; margin: 8px 0 20px; line-height: 0; }
  .logo { width: 300px; max-width: 80vw; height: auto; }
  .card {
    width: 100%; max-width: 420px;
    background: #1f2937; border-radius: 16px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  label { font-size: .9rem; color: #9ca3af; }
  input[type=text] {
    width: 100%; margin-top: 6px; padding: 14px;
    font-size: 1rem; border-radius: 10px; border: 1px solid #374151;
    background: #111827; color: #f3f4f6; outline: none;
  }
  input[type=text]:focus { border-color: #39ff14; box-shadow: 0 0 0 3px rgba(57,255,20,.15); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1; padding: 13px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    background: #3b82f6; color: white;
  }
  button.secondary { background: #374151; }
  #download { background: #39ff14; color: #052e16; box-shadow: 0 0 14px rgba(57,255,20,.45); }
  #download:disabled { box-shadow: none; }
  button:disabled { opacity: .4; cursor: default; }
  #qrBox {
    margin-top: 20px; background: white; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1 / 1; padding: 16px;
  }
  #qrBox canvas { width: 100%; height: auto; image-rendering: pixelated; }
  #placeholder { color: #9ca3af; text-align: center; font-size: .95rem; }
  #msg { min-height: 1.2em; margin-top: 10px; font-size: .9rem; color: #fca5a5; text-align: center; }

  /* PC: compacto y centrado en la pantalla */
  @media (min-width: 768px) {
    body { padding: 16px; justify-content: center; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    .logo { width: 330px; }
    .card { max-width: 380px; padding: 18px; border-radius: 14px; }
    label { font-size: .85rem; }
    input[type=text] { padding: 10px 12px; font-size: .95rem; margin-top: 5px; border-radius: 9px; }
    label[for=url] { margin-top: 12px !important; }
    #qrBox { margin-top: 14px; padding: 12px; border-radius: 10px; width: 260px; margin-left: auto; margin-right: auto; }
    #placeholder { font-size: .9rem; }
    #msg { margin-top: 6px; font-size: .85rem; }
    .row { margin-top: 8px; gap: 10px; }
    button { padding: 10px; font-size: .95rem; border-radius: 9px; }
  }
  footer { margin-top: 22px; text-align: center; color: #6b7280; font-size: .78rem; line-height: 1.7; letter-spacing: .3px; }
  footer a { color: #9ca3af; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: color .2s; }
  footer a:hover { color: #39ff14; }
  footer .nw { white-space: nowrap; }
  footer svg { width: 13px; height: 13px; }
  /* Celular: todo entra en una sola pantalla (probado para Samsung A16) */
  @media (max-width: 767px) {
    body { min-height: 100dvh; padding: 12px 14px; justify-content: center; }
    h1 { margin: 0 0 10px; }
    .logo { width: 230px; }
    .card { padding: 14px; border-radius: 14px; }
    label { font-size: .82rem; }
    input[type=text] { padding: 10px 12px; font-size: 16px; margin-top: 4px; border-radius: 9px; }
    label[for=url] { margin-top: 8px !important; }
    #qrBox {
      margin: 10px auto 0; padding: 8px; border-radius: 10px;
      width: min(100%, calc(100dvh - 420px)); min-width: 160px;
    }
    #placeholder { font-size: .85rem; }
    #msg { min-height: 0; margin-top: 4px; font-size: .8rem; }
    #msg:empty { display: none; }
    .row { margin-top: 10px; }
    button { padding: 11px; font-size: .95rem; border-radius: 9px; }
    footer { margin-top: 10px; font-size: .7rem; line-height: 1.5; }
  }
  .swatches { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .sw {
    width: 28px; height: 28px; border-radius: 50%; padding: 0; flex: none;
    border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 1px;
    cursor: pointer; transition: transform .15s; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .sw:hover { transform: scale(1.1); }
  .sw.active { border-color: #1f2937; outline-color: #39ff14; }
  #qrBox.has-qr { background: none; padding: 0; aspect-ratio: auto; }
  #qrBox.has-qr canvas { border-radius: 14px; image-rendering: auto; }
  @media (max-width: 767px) {
    .swatches { margin-top: 8px; gap: 7px; }
    .sw { width: 26px; height: 26px; }
    #qrBox { width: min(100%, calc(100dvh - 470px)); }
  }
</style>
</head>
<body>
  <h1><img src="logo.png" alt="QR Generator" class="logo"></h1>
  <div class="card">
    <label for="name">Nombre del proyecto</label>
    <input id="name" type="text" autocomplete="off" placeholder="Ej: Mi tienda online">
    <label for="url" style="display:block;margin-top:14px">Pegá el link</label>
    <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="https://ejemplo.com">
    <div class="swatches" id="swatches" aria-label="Color del QR"></div>
    <div id="qrBox"><div id="placeholder">El QR aparece acá</div></div>
    <div id="msg"></div>
    <div class="row">
      <button id="download" disabled>Descargar PNG</button>
      <button id="share" class="secondary" disabled>Compartir</button>
    </div>
  </div>

  <footer>
    <div><span class="nw">&copy; <span id="year">2026</span> Uskaer Technologies.</span> <span class="nw">All rights reserved.</span></div>
    <div>Designed &amp; developed by
      <a href="https://www.instagram.com/uskaeragenciadigital/" target="_blank" rel="noopener" aria-label="Uskaer on Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Uskaer</a>
    </div>
  </footer>

<script src="qrcode.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const input = document.getElementById('url');
  const box = document.getElementById('qrBox');
  const msg = document.getElementById('msg');
  const btnDownload = document.getElementById('download');
  const btnShare = document.getElementById('share');
  let canvas = null;

  // Paleta de colores (como Instagram): sólidos y degradados, todos legibles sobre blanco
  // Mismos colores que el QR de Instagram (degradados de abajo-izquierda a arriba-derecha)
  const PALETTE = [
    ['#000000'],                // negro
    ['#45bff3', '#258eda'],     // celeste
    ['#3f9fea', '#8830c7'],     // azul → violeta
    ['#5dc17b', '#3ac3ca'],     // verde → turquesa
    ['#5f5f5f', '#3a3a3a'],     // gris
    ['#e86d53', '#bd2d94'],     // naranja → rosa
    ['#de0f8d', '#9b2ad4'],     // fucsia → violeta
    ['#0866ff']                 // azul
  ];
  let color = PALETTE[0];
  const swBox = document.getElementById('swatches');
  PALETTE.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw' + (i === 0 ? ' active' : '');
    b.style.background = c.length > 1 ? `linear-gradient(45deg, ${c[0]}, ${c[1]})` : c[0];
    b.setAttribute('aria-label', 'Color ' + (i + 1));
    b.onclick = () => {
      color = c;
      swBox.querySelectorAll('.sw').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    };
    swBox.appendChild(b);
  });

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // Dibuja la tarjeta (QR + título) al tamaño exacto pedido, para que siempre se vea nítida
  function drawCard(qr, label, size) {
    const n = qr.getModuleCount(), quiet = 4;
    const W = Math.round(size), m = W / (n + quiet * 2);   // tamaño de cada módulo (puede tener decimales)
    const textH = label ? Math.round(W * 0.15) : 0;
    const H = W + textH;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    // Tarjeta blanca con bordes redondeados
    ctx.fillStyle = '#fff';
    roundRect(ctx, 0, 0, W, H, W * 0.06); ctx.fill();

    // Color de los puntos: sólido o degradado
    let fill = color[0];
    if (color.length > 1) {
      fill = ctx.createLinearGradient(0, H, W, 0);
      fill.addColorStop(0, color[0]); fill.addColorStop(1, color[1]);
    }
    ctx.fillStyle = fill;
    const px = i => Math.round((i + quiet) * m);   // bordes en píxeles enteros: sin borroneo ni líneas finas
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(px(c), px(r), px(c + 1) - px(c), px(r + 1) - px(r));

    // Nombre del proyecto debajo del QR
    if (label) {
      let fs = Math.round(textH * 0.78);
      const maxW = W - quiet * m * 2;
      const font = sz => `600 ${sz}px "Barlow Condensed", "Arial Narrow", sans-serif`;
      ctx.font = font(fs);
      while (ctx.measureText(label).width > maxW && fs > 8) { fs -= 1; ctx.font = font(fs); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (color.length > 1) {   // en el título el degradado va de izquierda a derecha, como en Instagram
        const tw = ctx.measureText(label).width;
        const tg = ctx.createLinearGradient(W / 2 - tw / 2, 0, W / 2 + tw / 2, 0);
        tg.addColorStop(0, color[0]); tg.addColorStop(1, color[1]);
        ctx.fillStyle = tg;
      }
      ctx.fillText(label, W / 2, W - quiet * m * 0.35 + textH / 2);
    }
    return cv;
  }

  let current = null;   // QR actual (para volver a dibujarlo en alta para descargar)

  function render() {
    const text = input.value.trim();
    msg.textContent = '';
    if (!text) {
      box.classList.remove('has-qr');
      box.innerHTML = '<div id="placeholder">El QR aparece acá</div>';
      canvas = current = null; btnDownload.disabled = btnShare.disabled = true;
      return;
    }
    let qr;
    try {
      qr = qrcode(0, 'M');
      qr.addData(unescape(encodeURIComponent(text)), 'Byte');
      qr.make();
    } catch (e) {
      msg.textContent = 'El texto es demasiado largo para un QR.';
      return;
    }
    current = { qr, label: nameInput.value.trim().toUpperCase() };

    // Vista previa: al tamaño real de la pantalla (ancho visible × densidad de píxeles)
    box.classList.add('has-qr');
    const cssW = box.clientWidth || 280;
    canvas = drawCard(qr, current.label, cssW * (window.devicePixelRatio || 1));
    canvas.style.width = cssW + 'px';
    box.innerHTML = ''; box.appendChild(canvas);
    btnDownload.disabled = false;
    btnShare.disabled = !(navigator.canShare);
  }


  const nameInput = document.getElementById('name');

  // Nombre del archivo: el nombre del proyecto, o si está vacío, el dominio del link
  function fileName() {
    let base = nameInput.value.trim();
    if (!base) {
      try { base = new URL(input.value.trim()).hostname.replace(/^www\./, ''); }
      catch (e) { base = ''; }
    }
    base = base.normalize('NFD').replace(/[̀-ͯ]/g, '')
               .replace(/[^\w.\- ]+/g, '').trim().replace(/\s+/g, '-');
    return 'QR-' + (base || 'codigo') + '.png';
  }

  // El PNG descargado se dibuja en alta resolución (2048 px)
  function getBlob() {
    const hi = drawCard(current.qr, current.label, 2048);
    return new Promise(res => hi.toBlob(res, 'image/png'));
  }

  btnDownload.onclick = async () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await getBlob());
    a.download = fileName();
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  btnShare.onclick = async () => {
    const file = new File([await getBlob()], fileName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: nameInput.value.trim() || 'Código QR' }); } catch (e) {}
    } else {
      msg.textContent = 'Tu navegador no permite compartir imágenes.';
    }
  };

  input.addEventListener('input', render);
  nameInput.addEventListener('input', render);
  window.addEventListener('resize', () => { if (current) render(); });
  // Cuando termina de cargar la fuente del título, redibuja el QR
  document.fonts.load('600 40px "Barlow Condensed"').then(render).catch(() => {});

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
